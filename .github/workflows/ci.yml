name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.22.x is the minimum version declared in go.mod.
        go: ['1.22.x', oldstable, stable]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      - name: go vet
        run: go vet ./...

      # Pinned so a new staticcheck release (which may require a newer Go)
      # cannot break CI. Bump deliberately.
      - name: Install staticcheck
        if: matrix.go == 'stable'
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.2

      - name: Run staticcheck
        if: matrix.go == 'stable'
        run: staticcheck ./...

      - name: Test with race detector
        run: go test -count=1 -race -coverprofile=coverage.txt -covermode=atomic ./...

      # Smoke-runs the benchmarks; numbers are not compared (no regression gate).
      - name: Run benchmarks
        if: matrix.go == 'stable'
        run: go test -run='^$' -bench=. -benchmem -benchtime=10000x ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage.txt
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      # Runs the linters and the gofmt check configured in .golangci.yml.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    # Informational until the MongoDB backend moves to its own module (#30):
    # fixes for its indirect dependencies need Go 1.25, above go.mod's minimum.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
      - name: Run govulncheck
        run: govulncheck ./...
