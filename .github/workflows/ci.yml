name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.22.x is the minimum version declared in go.mod.
        go: ['1.22.x', oldstable, stable]
    # Real MongoDB for the backend/mongodb integration tests.
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping: 1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      - name: go vet
        run: go vet ./...

      # backend/mongodb is a separate module; ./... above does not cover it.
      - name: go vet (backend/mongodb)
        working-directory: backend/mongodb
        run: go vet ./...

      # Pinned so a new staticcheck release (which may require a newer Go)
      # cannot break CI. Bump deliberately.
      - name: Install staticcheck
        if: matrix.go == 'stable'
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.2

      - name: Run staticcheck
        if: matrix.go == 'stable'
        run: staticcheck ./...

      - name: Run staticcheck (backend/mongodb)
        if: matrix.go == 'stable'
        working-directory: backend/mongodb
        run: staticcheck ./...

      - name: Test with race detector
        run: go test -count=1 -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Test with race detector (backend/mongodb)
        working-directory: backend/mongodb
        env:
          GOKUE_MONGODB_URI: mongodb://localhost:27017
        run: go test -count=1 -race ./...

      - name: Run examples
        run: |
          go run ./examples/persistence
          go run ./examples/http-offload -run 2s
          go run ./examples/graceful-shutdown -run 2s

      # Smoke-runs the benchmarks; numbers are not compared (no regression gate).
      - name: Run benchmarks
        if: matrix.go == 'stable'
        run: go test -run='^$' -bench=. -benchmem -benchtime=10000x ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.txt
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      # Runs the linters and the gofmt check configured in .golangci.yml.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: backend/mongodb

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
      - name: Run govulncheck
        run: govulncheck ./...
      # Informational: fixes for the MongoDB driver's indirect dependencies
      # need Go 1.25, above the module's minimum.
      - name: Run govulncheck (backend/mongodb)
        continue-on-error: true
        working-directory: backend/mongodb
        run: govulncheck ./...
